<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Extractor — Ergebnis</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="results-layout">

  <!-- ══════════ LEFT: Extracted elements ══════════ -->
  <div class="panel-extracted">
    <div class="panel-header">
      <div class="file-meta">
        <a href="/" class="back-link">← Neue PDF</a>
        <div class="file-name" id="filename"></div>
      </div>
      <div id="stats" style="display:flex;gap:.3rem;flex-wrap:wrap"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="text">Text</button>
      <button class="tab-btn" data-tab="images">Bilder</button>
      <button class="tab-btn" data-tab="tables">Tabellen</button>
    </div>

    <div class="panel-body">
      <div id="tab-text"   class="tab-panel active"><div class="spinner" style="margin:2rem auto"></div></div>
      <div id="tab-images" class="tab-panel"><div class="spinner" style="margin:2rem auto"></div></div>
      <div id="tab-tables" class="tab-panel"><div class="spinner" style="margin:2rem auto"></div></div>
    </div>
  </div>

  <!-- ══════════ CENTER: Composition Canvas ══════════ -->
  <div class="panel-composition">
    <div class="comp-toolbar">
      <span class="panel-title">Komposition</span>
      <button class="btn-merge" id="mergeBtn" hidden onclick="mergeSelected()">Zusammenführen</button>
      <button class="btn-download" id="downloadBtn" onclick="downloadComposition()">📄 PDF herunterladen</button>
    </div>

    <div class="comp-canvas" id="compCanvas">
      <!-- Empty overlay is a direct child of comp-canvas so inset:0 fills the visible viewport, not the 2400x1600 inner div -->
      <div class="comp-empty-overlay" id="compEmpty">
        <div class="comp-empty-box">
          Noch keine Elemente.<br>
          Klicke <strong>Einfügen</strong> bei einem Element links.
        </div>
      </div>
      <div class="comp-canvas-inner" id="compInner"></div>
    </div>
  </div>

  <!-- ══════════ RIGHT: PDF sidebar (collapsible) ══════════ -->
  <div class="panel-pdf" id="pdfPanel">
    <div class="pdf-toggle-bar">
      <button class="pdf-toggle-btn" id="pdfToggle" onclick="togglePdf()" title="PDF ein-/ausklappen">◀</button>
      <span class="pdf-toggle-label">Original PDF</span>
    </div>
    <iframe id="pdfFrame" title="Original PDF"></iframe>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
// URL params & session
// ═══════════════════════════════════════════════
const params    = new URLSearchParams(location.search);
const sessionId = params.get('session');
if (!sessionId) location.href = '/';

// ═══════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════
const state = {
  extracted: { text: [], images: [], tables: [] },
  deletedIds: new Set(),
  composition: [],   // each: { ...el, compId, x, y }
  compCounter: 0,
};

// Drag state (canvas cards)
let dragState = null;
// { compId, startMouseX, startMouseY, startCardX, startCardY }

// ═══════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════
document.getElementById('filename').textContent = params.get('filename') || 'Dokument';
document.getElementById('pdfFrame').src = `/api/sessions/${sessionId}/pdf`;

const statsEl = document.getElementById('stats');
[['pages','Seiten'],['images','Bilder'],['tables','Tabellen']].forEach(([k,l]) => {
  statsEl.innerHTML += `<span class="badge">${params.get(k) ?? '?'} ${l}</span>`;
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Global mouse events for canvas drag
document.addEventListener('mousemove', onGlobalMouseMove);
document.addEventListener('mouseup',   onGlobalMouseUp);

// ═══════════════════════════════════════════════
// Load extracted data
// ═══════════════════════════════════════════════
fetch(`/api/sessions/${sessionId}/text`).then(r => r.json()).then(data => {
  let idx = 0;
  (data.pages || []).forEach(page => {
    (page.blocks || []).forEach(block => {
      state.extracted.text.push({
        id: `text-${idx++}`, type: 'text',
        block_type: block.type, text: block.text, page: page.page,
      });
    });
  });
  renderExtracted('text');
}).catch(() => {
  document.getElementById('tab-text').innerHTML = '<div class="empty">Fehler beim Laden.</div>';
});

fetch(`/api/sessions/${sessionId}/images`).then(r => r.json()).then(data => {
  (data.images || []).forEach((img, i) => {
    state.extracted.images.push({ id: `img-${i}`, type: 'image', ...img });
  });
  renderExtracted('images');
}).catch(() => {
  document.getElementById('tab-images').innerHTML = '<div class="empty">Fehler beim Laden.</div>';
});

fetch(`/api/sessions/${sessionId}/tables`).then(r => r.json()).then(data => {
  (data.tables || []).forEach((tbl, i) => {
    state.extracted.tables.push({ id: `table-${i}`, type: 'table', ...tbl });
  });
  renderExtracted('tables');
}).catch(() => {
  document.getElementById('tab-tables').innerHTML = '<div class="empty">Fehler beim Laden.</div>';
});

// ═══════════════════════════════════════════════
// Render extracted panels
// ═══════════════════════════════════════════════
function renderExtracted(tab) {
  const container = document.getElementById(`tab-${tab}`);
  const key  = tab === 'text' ? 'text' : tab === 'images' ? 'images' : 'tables';
  const items = state.extracted[key];

  if (!items.length) {
    container.innerHTML = '<div class="empty">Keine Elemente gefunden.</div>';
    return;
  }

  container.innerHTML = items.map(el => {
    const deleted = state.deletedIds.has(el.id) ? 'deleted' : '';
    const longText = el.type === 'text' && (el.text || '').length > 120;
    return `<div class="ext-card ${deleted}" data-id="${el.id}">
      <div class="ext-card-top">
        <span class="ext-type-badge">${extBadgeLabel(el)}</span>
        <span class="ext-page-label">Seite ${el.page}</span>
        <button class="btn-insert" onclick="insertEl('${el.id}','${tab}')">+ Einfügen</button>
        <button class="btn-delete" onclick="deleteExtracted('${el.id}','${tab}')">✕</button>
      </div>
      <div class="ext-card-body ${longText ? 'has-fade' : ''}">
        ${extPreviewHtml(el)}
      </div>
    </div>`;
  }).join('');
}

function extBadgeLabel(el) {
  if (el.type === 'text') {
    return el.block_type === 'heading' ? 'H1' : el.block_type === 'subheading' ? 'H2' : 'Text';
  }
  return el.type === 'image' ? 'Bild' : 'Tabelle';
}

function extPreviewHtml(el) {
  if (el.type === 'image') return `<img src="${el.url}" alt="">`;
  if (el.type === 'table') return `<span style="color:var(--muted)">Tabelle ${el.index} · ${el.rows} Zeilen × ${el.cols} Sp.</span>`;
  return escHtml(el.text);
}

// ═══════════════════════════════════════════════
// Extracted actions
// ═══════════════════════════════════════════════
function insertEl(id, tab) {
  const key   = tab === 'text' ? 'text' : tab === 'images' ? 'images' : 'tables';
  const el    = state.extracted[key].find(e => e.id === id);
  if (!el) return;

  // Grid cascade: 5 columns × 240px spacing (cards are 220px wide), 130px row height
  const n   = state.composition.length;
  const col = n % 5;
  const row = Math.floor(n / 5);
  const x   = 40 + col * 240;
  const y   = 40 + row * 130;

  state.composition.push({ ...el, compId: `c${state.compCounter++}`, x, y });
  renderComposition();

  // Scroll the canvas so the new card is visible
  const canvas = document.getElementById('compCanvas');
  canvas.scrollTo({ left: Math.max(0, x - 60), top: Math.max(0, y - 60), behavior: 'smooth' });
}

function deleteExtracted(id, tab) {
  state.deletedIds.add(id);
  const card = document.querySelector(`.ext-card[data-id="${id}"]`);
  if (card) card.classList.add('deleted');
}

// ═══════════════════════════════════════════════
// Canvas composition rendering
// ═══════════════════════════════════════════════
function renderComposition() {
  const inner  = document.getElementById('compInner');
  const empty  = document.getElementById('compEmpty');

  // Remove all existing comp-cards from the inner canvas
  inner.innerHTML = '';

  empty.style.display = state.composition.length === 0 ? 'flex' : 'none';

  state.composition.forEach(el => {
    const card = buildCard(el);
    inner.appendChild(card);
  });

  updateMergeBtn();
}

function buildCard(el) {
  const card = document.createElement('div');
  card.className = 'comp-card';
  card.dataset.compid = el.compId;
  card.dataset.type   = el.type;
  if (el.type === 'text') card.dataset.btype = el.block_type || 'paragraph';
  card.style.left = el.x + 'px';
  card.style.top  = el.y + 'px';

  // Badge class
  let badgeClass = 'b-para';
  let badgeText  = 'Text';
  if (el.type === 'text') {
    if (el.block_type === 'heading')    { badgeClass = 'b-h1';  badgeText = 'H1'; }
    else if (el.block_type === 'subheading') { badgeClass = 'b-h2'; badgeText = 'H2'; }
    else { badgeClass = 'b-para'; badgeText = 'Text'; }
  } else if (el.type === 'image') { badgeClass = 'b-img'; badgeText = 'Bild'; }
  else if (el.type === 'table')  { badgeClass = 'b-tbl'; badgeText = 'Tabelle'; }

  const mergeCheckbox = el.type === 'text'
    ? `<input type="checkbox" class="comp-merge-check" data-compid="${el.compId}" onchange="updateMergeBtn()">`
    : '';

  const bodyContent = cardBodyHtml(el);
  const longContent = el.type === 'text' && (el.text || '').length > 90;

  card.innerHTML = `
    <div class="comp-card-header">
      <span class="comp-badge ${badgeClass}">${badgeText}</span>
      ${mergeCheckbox}
      <span style="font-size:.68rem;color:var(--muted);flex:1;text-align:right">S.${el.page}</span>
      <button class="btn-comp-remove" onclick="removeFromComp('${el.compId}')" title="Entfernen">✕</button>
    </div>
    <div class="comp-card-body ${longContent ? 'faded' : ''}">
      ${bodyContent}
    </div>`;

  // Drag: attach mousedown to the card header (not the buttons inside)
  card.querySelector('.comp-card-header').addEventListener('mousedown', e => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    e.preventDefault();
    startCardDrag(e, el.compId);
  });

  return card;
}

function cardBodyHtml(el) {
  if (el.type === 'image') return `<img src="${el.url}" alt="">`;
  if (el.type === 'table') return `<span style="color:var(--muted)">Tabelle ${el.index} · Seite ${el.page}</span>`;
  return escHtml(el.text);
}

// ═══════════════════════════════════════════════
// Canvas card dragging
// ═══════════════════════════════════════════════
function startCardDrag(e, compId) {
  const el = state.composition.find(c => c.compId === compId);
  if (!el) return;

  dragState = {
    compId,
    startMouseX: e.clientX,
    startMouseY: e.clientY,
    startCardX:  el.x,
    startCardY:  el.y,
  };

  const cardEl = document.querySelector(`.comp-card[data-compid="${compId}"]`);
  if (cardEl) cardEl.classList.add('is-dragging');
}

function onGlobalMouseMove(e) {
  if (!dragState) return;

  const dx = e.clientX - dragState.startMouseX;
  const dy = e.clientY - dragState.startMouseY;

  const el = state.composition.find(c => c.compId === dragState.compId);
  if (!el) return;

  el.x = Math.max(0, dragState.startCardX + dx);
  el.y = Math.max(0, dragState.startCardY + dy);

  const cardEl = document.querySelector(`.comp-card[data-compid="${dragState.compId}"]`);
  if (cardEl) {
    cardEl.style.left = el.x + 'px';
    cardEl.style.top  = el.y + 'px';
  }
}

function onGlobalMouseUp() {
  if (!dragState) return;
  const cardEl = document.querySelector(`.comp-card[data-compid="${dragState.compId}"]`);
  if (cardEl) cardEl.classList.remove('is-dragging');
  dragState = null;
}

// ═══════════════════════════════════════════════
// Remove from composition
// ═══════════════════════════════════════════════
function removeFromComp(compId) {
  state.composition = state.composition.filter(e => e.compId !== compId);
  renderComposition();
}

// ═══════════════════════════════════════════════
// Merge
// ═══════════════════════════════════════════════
function updateMergeBtn() {
  const checked = document.querySelectorAll('.comp-merge-check:checked');
  document.getElementById('mergeBtn').hidden = checked.length < 2;
}

function mergeSelected() {
  const checked  = [...document.querySelectorAll('.comp-merge-check:checked')];
  const ids      = new Set(checked.map(cb => cb.dataset.compid));
  const selected = state.composition.filter(e => ids.has(e.compId));
  if (selected.length < 2) return;

  // Use position of topmost selected card
  const topEl = selected.reduce((a, b) => a.y < b.y ? a : b);

  const merged = {
    compId:     `c${state.compCounter++}`,
    type:       'text',
    block_type: 'paragraph',
    page:       topEl.page,
    text:       selected.map(e => e.text).join(' '),
    x:          topEl.x,
    y:          topEl.y,
  };

  state.composition = state.composition.filter(e => !ids.has(e.compId));
  state.composition.push(merged);
  renderComposition();
}

// ═══════════════════════════════════════════════
// Download composed PDF
// ═══════════════════════════════════════════════
async function downloadComposition() {
  if (!state.composition.length) {
    alert('Füge zuerst Elemente zur Komposition hinzu.');
    return;
  }
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Wird erstellt…';

  // Sort by vertical position (top → bottom), then horizontal (left → right)
  const sorted = [...state.composition].sort((a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x);

  try {
    const res = await fetch(`/api/sessions/${sessionId}/compose`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ elements: sorted }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Unbekannter Fehler');
    }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'zusammengestellt.pdf'; a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(`Fehler: ${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '📄 PDF herunterladen';
  }
}

// ═══════════════════════════════════════════════
// PDF sidebar toggle
// ═══════════════════════════════════════════════
function togglePdf() {
  document.getElementById('pdfPanel').classList.toggle('collapsed');
}

// ═══════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════
function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
